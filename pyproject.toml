[project]
name = "triagepod"
version = "0.1.0"
description = "GitHub-native issue triage assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic>=2.12.0",
  "rapidfuzz>=3.14.0",
  "ruamel.yaml>=0.18.16",
  "structlog>=25.5.0",
  "tenacity>=9.1.2",
]

[project.scripts]
triagepod-action = "triagepod.interfaces.github_action.main:main"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "mypy>=1.18.2",
  "pip-audit>=2.9.0",
  "pytest>=9.0.1",
  "pytest-mock>=3.15.1",
  "respx>=0.22.0",
  "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
